<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img">
  <title>Two different factorizations inside the system of numbers one more than a multiple of four</title>
  <desc>Four hundred forty-one shown split two ways, as nine times forty-nine and as twenty-one times twenty-one, with all four factors unsplittable inside the system.</desc>
  <rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Inside the system 1, 5, 9, 13, 17, 21, 25, ... uniqueness fails</text>
  <text x="60" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">every member is one more than a multiple of four, and the system is closed under</text>
  <text x="60" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">multiplication because such numbers multiply to such numbers</text>
  <rect x="255" y="96" width="190" height="40" fill="#eef2f6" rx="6" stroke="#1f2933" stroke-width="1.2"/>
  <text x="350" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">441</text>
  <text x="350" y="129" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">which is 4 times 110 plus 1</text>
  <line x1="321.2" y1="140" x2="196.724" y2="176.053" stroke="#2f6f9f" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="190,178 197.6,179.078 195.847,173.027" fill="#2f6f9f"/>
  <rect x="60" y="182" width="120" height="40" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="120" y="206.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle">9</text>
  <text x="190" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">times</text>
  <rect x="200" y="182" width="120" height="40" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="260" y="206.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle">49</text>
  <line x1="378.8" y1="140" x2="503.276" y2="176.053" stroke="#c2622d" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="510,178 504.153,173.027 502.4,179.078" fill="#c2622d"/>
  <rect x="380" y="182" width="120" height="40" fill="#dbe6ef" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="440" y="206.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle">21</text>
  <text x="510" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">times</text>
  <rect x="520" y="182" width="120" height="40" fill="#dbe6ef" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="580" y="206.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle">21</text>
  <text x="60" y="254" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">None of 9, 21, 49 splits inside the system: their only other factors are 3 and 7, and</text>
  <text x="60" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">neither 3 nor 7 is one more than a multiple of four. So all four factors are as far down</text>
  <text x="60" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">as the system goes, and 441 has two genuinely different factorizations.</text>
  <text x="60" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Existence of a factorization survives here. Uniqueness does not. So uniqueness in the</text>
  <text x="60" y="338" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">integers is a theorem about the integers, not a law of arithmetic.</text>
</svg>
