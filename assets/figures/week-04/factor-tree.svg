<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img">
  <title>A factor tree for three hundred sixty</title>
  <desc>A branching diagram splitting three hundred sixty into factors repeatedly until every leaf is prime, ending on three twos, two threes, and one five.</desc>
  <rect x="0" y="0" width="660" height="340" fill="#ffffff"/>
  <text x="330" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Splitting until every leaf is prime</text>
  <line x1="330" y1="86" x2="240" y2="114" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="330" y1="86" x2="430" y2="114" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="240" y1="146" x2="185" y2="174" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="240" y1="146" x2="300" y2="174" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="430" y1="146" x2="390" y2="174" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="430" y1="146" x2="480" y2="174" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="185" y1="206" x2="150" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="185" y1="206" x2="225" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="300" y1="206" x2="280" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="300" y1="206" x2="350" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="330" cy="70" r="19" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="330" y="75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">360</text>
  <circle cx="240" cy="130" r="19" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="240" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">36</text>
  <circle cx="430" cy="130" r="19" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="430" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">10</text>
  <circle cx="185" cy="190" r="19" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="185" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">6</text>
  <circle cx="300" cy="190" r="19" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="300" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">6</text>
  <circle cx="390" cy="190" r="19" fill="#dbe6ef" stroke="#3f7a52" stroke-width="1.5"/>
  <text x="390" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <circle cx="480" cy="190" r="19" fill="#dbe6ef" stroke="#3f7a52" stroke-width="1.5"/>
  <text x="480" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">5</text>
  <circle cx="150" cy="250" r="19" fill="#dbe6ef" stroke="#3f7a52" stroke-width="1.5"/>
  <text x="150" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <circle cx="225" cy="250" r="19" fill="#dbe6ef" stroke="#3f7a52" stroke-width="1.5"/>
  <text x="225" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <circle cx="280" cy="250" r="19" fill="#dbe6ef" stroke="#3f7a52" stroke-width="1.5"/>
  <text x="280" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <circle cx="350" cy="250" r="19" fill="#dbe6ef" stroke="#3f7a52" stroke-width="1.5"/>
  <text x="350" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="60" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">A different first split, say 360 as 8 times 45, grows a different tree and still ends</text>
  <text x="60" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">on three twos, two threes, and one five. That the leaves never depend on the route is</text>
  <text x="60" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the theorem, and it is the half that needs a proof.</text>
</svg>
