<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" role="img">
  <title>Adding one to each coordinate visits all six cells</title>
  <desc>A grid of ordered pairs with an attempt to reach every cell by repeatedly adding one fixed pair, succeeding when the two sizes share no factor and failing when they do.</desc>
  <rect x="0" y="0" width="660" height="360" fill="#ffffff"/>
  <text x="330" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Repeatedly adding the pair with one in each slot</text>
  <rect x="170" y="60" width="110" height="62" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.1"/>
  <text x="225" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(0, 0)</text>
  <rect x="280" y="60" width="110" height="62" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.1"/>
  <text x="335" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(0, 1)</text>
  <rect x="390" y="60" width="110" height="62" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.1"/>
  <text x="445" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(0, 2)</text>
  <rect x="170" y="122" width="110" height="62" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.1"/>
  <text x="225" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1, 0)</text>
  <rect x="280" y="122" width="110" height="62" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.1"/>
  <text x="335" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1, 1)</text>
  <rect x="390" y="122" width="110" height="62" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.1"/>
  <text x="445" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1, 2)</text>
  <line x1="225" y1="73" x2="328.902" y2="131.563" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="335,135 330.449,128.819 327.355,134.307" fill="#3f7a52"/>
  <line x1="335" y1="135" x2="438.902" y2="76.437" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="445,73 437.355,73.693 440.449,79.181" fill="#3f7a52"/>
  <line x1="445" y1="73" x2="231.738" y2="133.101" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="225,135 232.592,136.133 230.883,130.069" fill="#3f7a52"/>
  <line x1="225" y1="135" x2="328.902" y2="76.437" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="335,73 327.355,73.693 330.449,79.181" fill="#3f7a52"/>
  <line x1="335" y1="73" x2="438.902" y2="131.563" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="445,135 440.449,128.819 437.355,134.307" fill="#3f7a52"/>
  <line x1="445" y1="135" x2="231.738" y2="74.899" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="225,73 230.883,77.931 232.592,71.867" fill="#3f7a52"/>
  <circle cx="265" cy="71" r="7" fill="#3f7a52"/>
  <circle cx="375" cy="71" r="7" fill="#3f7a52"/>
  <circle cx="485" cy="71" r="7" fill="#3f7a52"/>
  <circle cx="265" cy="133" r="7" fill="#3f7a52"/>
  <circle cx="375" cy="133" r="7" fill="#3f7a52"/>
  <circle cx="485" cy="133" r="7" fill="#3f7a52"/>
  <rect x="90" y="214" width="480" height="42" fill="#e2eee6" rx="6" stroke="#3f7a52" stroke-width="1.2"/>
  <text x="330" y="231" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">the walk visits all 6 cells before returning</text>
  <text x="330" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">so one element generates the whole product, which is therefore cyclic</text>
  <text x="90" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The two side lengths are 2 and 3, whose greatest common divisor is 1.</text>
</svg>
