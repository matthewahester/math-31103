<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 382" width="700" height="382" role="img">
  <title>Element order profiles of three groups</title>
  <desc>A table counting how many elements of each order sit in the cyclic group of order four, the Klein four-group, and the invertible classes modulo fifteen.</desc>
  <rect x="0" y="0" width="700" height="382" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Counting elements by their order separates groups</text>
  <rect x="50" y="58" width="630" height="40" fill="#eef2f6"/>
  <text x="59" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">group</text>
  <text x="315" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">size</text>
  <text x="405" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">of order 1</text>
  <text x="515" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">of order 2</text>
  <text x="625" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">of order 4</text>
  <line x1="50" y1="58" x2="680" y2="58" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="59" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">cyclic group of order four</text>
  <text x="315" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">4</text>
  <text x="405" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="515" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="625" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="50" y1="98" x2="680" y2="98" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="50" y="138" width="630" height="40" fill="#eef2f6"/>
  <text x="59" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">the four-group</text>
  <text x="315" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">4</text>
  <text x="405" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="515" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="625" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="50" y1="138" x2="680" y2="138" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="59" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">classes coprime to 15</text>
  <text x="315" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">8</text>
  <text x="405" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="515" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="625" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">4</text>
  <line x1="50" y1="178" x2="680" y2="178" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="50" y="218" width="630" height="40" fill="#eef2f6"/>
  <text x="59" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">cyclic of four times cyclic of two</text>
  <text x="315" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">8</text>
  <text x="405" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="515" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="625" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">4</text>
  <line x1="50" y1="218" x2="680" y2="218" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="258" x2="680" y2="258" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="280" y1="58" x2="280" y2="258" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="350" y1="58" x2="350" y2="258" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="460" y1="58" x2="460" y2="258" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="570" y1="58" x2="570" y2="258" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="58" x2="50" y2="258" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="680" y1="58" x2="680" y2="258" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="50" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The first two rows have the same size and different profiles, so no</text>
  <text x="50" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">relabelling can turn one into the other. The last two rows have identical</text>
  <text x="50" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">profiles, which is evidence for a match rather than a proof of one — but</text>
  <text x="50" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">here the match is genuine, and Week 11 supplies the argument.</text>
</svg>
