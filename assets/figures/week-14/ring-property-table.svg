<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" width="700" height="404" role="img">
  <title>Five rings against four properties</title>
  <desc>A table with five example rings as rows and the properties commutative, has a one, has zero divisors, and is an integral domain as columns.</desc>
  <rect x="0" y="0" width="700" height="404" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Which assumptions actually hold where</text>
  <rect x="26" y="58" width="644" height="40" fill="#eef2f6"/>
  <text x="35" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">the ring</text>
  <text x="281" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">commutative</text>
  <text x="386" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">has a one</text>
  <text x="503" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">has zero divisors</text>
  <text x="620" y="82.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">a domain</text>
  <line x1="26" y1="58" x2="670" y2="58" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="35" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">the integers</text>
  <text x="281" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="386" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="503" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">no</text>
  <text x="620" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <line x1="26" y1="98" x2="670" y2="98" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="26" y="138" width="644" height="40" fill="#eef2f6"/>
  <text x="35" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">the even integers</text>
  <text x="281" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="386" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">no</text>
  <text x="503" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">no</text>
  <text x="620" y="162.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">no</text>
  <line x1="26" y1="138" x2="670" y2="138" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="35" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">the classes modulo six</text>
  <text x="281" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="386" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="503" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="620" y="202.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">no</text>
  <line x1="26" y1="178" x2="670" y2="178" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="26" y="218" width="644" height="40" fill="#eef2f6"/>
  <text x="35" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">the classes modulo five</text>
  <text x="281" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="386" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="503" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">no</text>
  <text x="620" y="242.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <line x1="26" y1="218" x2="670" y2="218" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="35" y="282.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">two by two real matrices</text>
  <text x="281" y="282.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">no</text>
  <text x="386" y="282.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="503" y="282.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">yes</text>
  <text x="620" y="282.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">no</text>
  <line x1="26" y1="258" x2="670" y2="258" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="26" y1="298" x2="670" y2="298" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="226" y1="58" x2="226" y2="298" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="336" y1="58" x2="336" y2="298" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="436" y1="58" x2="436" y2="298" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="570" y1="58" x2="570" y2="298" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="26" y1="58" x2="26" y2="298" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="670" y1="58" x2="670" y2="298" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="26" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The even integers are a ring with no multiplicative identity, so a domain</text>
  <text x="26" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">must ask for one explicitly. The classes modulo six are commutative with a one</text>
  <text x="26" y="366" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">and still not a domain. Not one of these four properties implies another.</text>
</svg>
