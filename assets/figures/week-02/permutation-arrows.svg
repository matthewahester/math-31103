<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img">
  <title>A permutation drawn as arrows between two rows</title>
  <desc>Six labelled dots in a top row send arrows to six labelled dots in a bottom row, one arrow leaving and one arriving at every dot.</desc>
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="320" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="bold">The permutation sending 1 to 3, 2 to 6, 3 to 5, 4 to 4, 5 to 1, 6 to 2</text>
  <circle cx="70" cy="90" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="70" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
  <circle cx="70" cy="240" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="70" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
  <circle cx="170" cy="90" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="170" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
  <circle cx="170" cy="240" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="170" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
  <circle cx="270" cy="90" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="270" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
  <circle cx="270" cy="240" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="270" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
  <circle cx="370" cy="90" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="370" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">4</text>
  <circle cx="370" cy="240" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="370" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">4</text>
  <circle cx="470" cy="90" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="470" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
  <circle cx="470" cy="240" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="470" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
  <circle cx="570" cy="90" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="570" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
  <circle cx="570" cy="240" r="15" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
  <text x="570" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
  <line x1="70" y1="107" x2="263.945" y2="219.488" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="270,223 265.525,216.763 262.364,222.213" fill="#2f6f9f"/>
  <line x1="170" y1="107" x2="563.277" y2="221.05" stroke="#c2622d" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="570,223 564.154,218.025 562.4,224.076" fill="#c2622d"/>
  <line x1="270" y1="107" x2="463.945" y2="219.488" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="470,223 465.525,216.763 462.364,222.213" fill="#2f6f9f"/>
  <line x1="370" y1="107" x2="370" y2="216" stroke="#5b6672" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="370,223 373.15,216 366.85,216" fill="#5b6672"/>
  <line x1="470" y1="107" x2="76.723" y2="221.05" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="70,223 77.6,224.076 75.846,218.025" fill="#2f6f9f"/>
  <line x1="570" y1="107" x2="176.723" y2="221.05" stroke="#c2622d" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="170,223 177.6,224.076 175.846,218.025" fill="#c2622d"/>
  <text x="45" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">domain</text>
  <text x="45" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">codomain</text>
  <text x="45" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Exactly one arrow leaves each dot above and exactly one arrives at each dot</text>
  <text x="45" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">below: that is what makes the map a bijection of the set onto itself, and</text>
  <text x="45" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the element 4 is fixed, which a permutation is entirely allowed to do.</text>
</svg>
