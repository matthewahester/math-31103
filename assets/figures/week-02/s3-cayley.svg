  <line x1="720" y1="50" x2="720" y2="344" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="90" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The shaded blocks are the products that land back among the three even permutations,</text>
  <text x="90" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">so those three are closed under composition. That set is the alternating group on three</text>
  <text x="90" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">letters. The table is not symmetric across its diagonal, so composition here does not</text>
  <text x="90" y="426" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">commute: reading row (1 2) against row (1 2 3) shows two different products.</text>
</svg>
