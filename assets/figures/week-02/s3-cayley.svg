  <text x="225" y="201.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3 2)</text>
  <text x="315" y="201.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">e</text>
  <text x="405" y="201.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2 3)</text>
  <text x="495" y="201.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(2 3)</text>
