  <text x="675" y="243.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2 3)</text>
  <line x1="90" y1="218" x2="720" y2="218" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="135" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3)</text>
  <text x="225" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3)</text>
  <text x="315" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2)</text>
  <text x="405" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(2 3)</text>
  <text x="495" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2 3)</text>
  <text x="585" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">e</text>
  <text x="675" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3 2)</text>
  <line x1="90" y1="260" x2="720" y2="260" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="135" y="327.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(2 3)</text>
  <text x="225" y="327.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(2 3)</text>
  <text x="315" y="327.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3)</text>
  <text x="405" y="327.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2)</text>
  <text x="495" y="327.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3 2)</text>
  <text x="585" y="327.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2 3)</text>
  <text x="675" y="327.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">e</text>
