<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img">
  <title>The Cayley table of the symmetric group on three letters</title>
  <desc>A six by six composition table for the six permutations of three letters, with the three even permutations shaded as a block in the top left.</desc>
  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>
  <text x="360" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Composing the six permutations of three letters, later map first</text>
  <rect x="180" y="92" width="270" height="126" fill="#e2eee6"/>
  <rect x="450" y="218" width="270" height="126" fill="#e2eee6"/>
  <rect x="90" y="50" width="630" height="42" fill="#dbe6ef"/>
