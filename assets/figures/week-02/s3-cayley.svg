  <text x="225" y="75.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">e</text>
  <text x="315" y="75.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">(1 2 3)</text>
  <text x="405" y="75.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">(1 3 2)</text>
  <text x="495" y="75.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">(1 2)</text>
  <text x="585" y="75.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">(1 3)</text>
  <text x="675" y="75.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">(2 3)</text>
  <line x1="90" y1="50" x2="720" y2="50" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="135" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">e</text>
  <text x="225" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">e</text>
  <text x="315" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2 3)</text>
  <text x="405" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3 2)</text>
  <text x="495" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2)</text>
  <text x="585" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3)</text>
  <text x="675" y="117.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(2 3)</text>
  <line x1="90" y1="92" x2="720" y2="92" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
