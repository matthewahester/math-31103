  <text x="405" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">e</text>
  <text x="495" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 3)</text>
  <text x="585" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(2 3)</text>
  <text x="675" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">(1 2)</text>
  <line x1="90" y1="134" x2="720" y2="134" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
