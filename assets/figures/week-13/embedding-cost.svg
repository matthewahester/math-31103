<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
  <title>The size of the group against the size of the permutation group it lands in</title>
  <desc>A bar chart comparing n with n factorial for n from three to six, the factorial bars growing far faster.</desc>
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>
  <text x="340" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">What the embedding costs</text>
  <rect x="90" y="246" width="46" height="4" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.3" fill-opacity="0.35"/>
  <rect x="146" y="248.467" width="46" height="1.533" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.3" fill-opacity="0.35"/>
  <text x="113" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">n is 3</text>
  <text x="169" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="middle">6</text>
  <text x="113" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">3</text>
  <rect x="235" y="246" width="46" height="4" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.3" fill-opacity="0.35"/>
  <rect x="291" y="243.867" width="46" height="6.133" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.3" fill-opacity="0.35"/>
  <text x="258" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">n is 4</text>
  <text x="314" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="middle">24</text>
  <text x="258" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">4</text>
  <rect x="380" y="246" width="46" height="4" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.3" fill-opacity="0.35"/>
  <rect x="436" y="219.333" width="46" height="30.667" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.3" fill-opacity="0.35"/>
  <text x="403" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">n is 5</text>
  <text x="459" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="middle">120</text>
  <text x="403" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">5</text>
  <rect x="525" y="246" width="46" height="4" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.3" fill-opacity="0.35"/>
  <rect x="581" y="66" width="46" height="184" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.3" fill-opacity="0.35"/>
  <text x="548" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">n is 6</text>
  <text x="604" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="middle">720</text>
  <text x="548" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle">6</text>
  <line x1="80" y1="250" x2="620" y2="250" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <text x="120" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="middle" font-weight="bold">group size</text>
  <text x="260" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start" font-weight="bold">size of the permutation group it embeds in</text>
  <text x="60" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">A group of six elements is placed inside one of seven hundred twenty. The</text>
  <text x="60" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">theorem is a statement about what is possible, not a recipe worth following:</text>
  <text x="60" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the copy it produces is correct and almost always far larger than necessary.</text>
</svg>
