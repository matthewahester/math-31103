<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 424" width="700" height="424" role="img">
  <title>The cyclic group of order four inside the permutations of four</title>
  <desc>Each element of a four-element group is listed beside the permutation of four symbols that left multiplication by it produces.</desc>
  <rect x="0" y="0" width="700" height="424" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="bold">The cyclic group of order four inside the permutations of four</text>
  <rect x="38" y="62" width="622" height="44" fill="#eef2f6"/>
  <text x="116" y="88.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">group element</text>
  <text x="203" y="88.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">sends the four elements to</text>
  <text x="573" y="88.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">as a permutation</text>
  <line x1="38" y1="62" x2="660" y2="62" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="116" y="132.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0</text>
  <text x="203" y="132.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">0 1 2 3 stay where they are</text>
  <text x="573" y="132.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">e</text>
  <line x1="38" y1="106" x2="660" y2="106" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="38" y="150" width="622" height="44" fill="#eef2f6"/>
  <text x="116" y="176.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="203" y="176.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">0 1 2 3 become 1 2 3 0</text>
  <text x="573" y="176.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">(1 2 3 4)</text>
  <line x1="38" y1="150" x2="660" y2="150" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="116" y="220.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">2</text>
  <text x="203" y="220.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">0 1 2 3 become 2 3 0 1</text>
  <text x="573" y="220.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">(1 3)(2 4)</text>
  <line x1="38" y1="194" x2="660" y2="194" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="38" y="238" width="622" height="44" fill="#eef2f6"/>
  <text x="116" y="264.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="203" y="264.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">0 1 2 3 become 3 0 1 2</text>
  <text x="573" y="264.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">(1 4 3 2)</text>
  <line x1="38" y1="238" x2="660" y2="238" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="282" x2="660" y2="282" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="194" y1="62" x2="194" y2="282" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="486" y1="62" x2="486" y2="282" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="38" y1="62" x2="38" y2="282" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="660" y1="62" x2="660" y2="282" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="486" y="106" width="174" height="44" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.3" fill-opacity="0.16"/>
  <rect x="486" y="150" width="174" height="44" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.3" fill-opacity="0.16"/>
  <rect x="486" y="194" width="174" height="44" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.3" fill-opacity="0.16"/>
  <text x="38" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Left multiplication by a fixed element rearranges the group without</text>
  <text x="38" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">repeating or losing anything, so it is a permutation of the four elements.</text>
  <text x="38" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The four permutations listed are closed under composition, so they form a</text>
  <text x="38" y="370" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">subgroup of the twenty-four permutations of four symbols.</text>
</svg>
