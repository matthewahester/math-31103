<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img">
  <title>The determinant as a homomorphism</title>
  <desc>A large region of invertible matrices on the left, an arrow marked determinant, and a line of non-zero real numbers on the right, with the matrices of determinant one marked.</desc>
  <rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Matrices in, non-zero numbers out</text>
  <circle cx="200" cy="170" r="118" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.6" fill-opacity="0.13"/>
  <text x="200" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">invertible two by two matrices</text>
  <circle cx="200" cy="190" r="58" fill="#3f7a52" stroke="#3f7a52" stroke-width="1.6" fill-opacity="0.2"/>
  <text x="200" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">determinant one</text>
  <text x="200" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="middle">the kernel</text>
  <line x1="330" y1="170" x2="433" y2="170" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="440,170 433,166.85 433,173.15" fill="#1f2933"/>
  <text x="385" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">determinant</text>
  <line x1="470" y1="170" x2="660" y2="170" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="490" y1="164" x2="490" y2="176" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="490" y="194" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-2</text>
  <line x1="530" y1="164" x2="530" y2="176" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="530" y="194" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-1</text>
  <line x1="570" y1="164" x2="570" y2="176" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="570" y="194" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="610" y1="164" x2="610" y2="176" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="610" y="194" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="650" y1="164" x2="650" y2="176" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="650" y="194" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">3</text>
  <circle cx="570" cy="170" r="7" fill="#3f7a52"/>
  <text x="570" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="middle" font-weight="bold">1</text>
  <text x="565" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="middle">every non-zero value is reached</text>
  <text x="60" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The determinant of a product is the product of the determinants, which is exactly</text>
  <text x="60" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the homomorphism condition. Every non-zero real is a determinant, so the image is</text>
  <text x="60" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">everything, and the kernel is the matrices of determinant one. So the quotient of</text>
  <text x="60" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">one by the other is the non-zero reals under multiplication.</text>
</svg>
