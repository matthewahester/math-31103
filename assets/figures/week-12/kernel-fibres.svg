<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img">
  <title>The fibres of a homomorphism are the cosets of its kernel</title>
  <desc>Four parallel strips in the domain, each carrying an arrow to one point of the image, with the strip that lands on the identity marked as the kernel.</desc>
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Everything sent to one place forms one coset</text>
  <rect x="60" y="66" width="270" height="52" fill="#3f7a52" stroke="#3f7a52" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="60" y="66" width="270" height="52" fill="none" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="195" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">the kernel</text>
  <circle cx="100" cy="106" r="6" fill="#3f7a52" fill-opacity="0.8"/>
  <circle cx="148" cy="106" r="6" fill="#3f7a52" fill-opacity="0.8"/>
  <circle cx="196" cy="106" r="6" fill="#3f7a52" fill-opacity="0.8"/>
  <circle cx="244" cy="106" r="6" fill="#3f7a52" fill-opacity="0.8"/>
  <circle cx="292" cy="106" r="6" fill="#3f7a52" fill-opacity="0.8"/>
  <line x1="338" y1="92" x2="463" y2="92" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="470,92 463,88.85 463,95.15" fill="#5b6672"/>
  <circle cx="500" cy="92" r="11" fill="#3f7a52"/>
  <text x="522" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="start">the identity</text>
  <rect x="60" y="138" width="270" height="52" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="60" y="138" width="270" height="52" fill="none" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="195" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">a second coset</text>
  <circle cx="100" cy="178" r="6" fill="#2f6f9f" fill-opacity="0.8"/>
  <circle cx="148" cy="178" r="6" fill="#2f6f9f" fill-opacity="0.8"/>
  <circle cx="196" cy="178" r="6" fill="#2f6f9f" fill-opacity="0.8"/>
  <circle cx="244" cy="178" r="6" fill="#2f6f9f" fill-opacity="0.8"/>
  <circle cx="292" cy="178" r="6" fill="#2f6f9f" fill-opacity="0.8"/>
  <line x1="338" y1="164" x2="463" y2="164" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="470,164 463,160.85 463,167.15" fill="#5b6672"/>
  <circle cx="500" cy="164" r="11" fill="#2f6f9f"/>
  <text x="522" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="start">one element</text>
  <rect x="60" y="210" width="270" height="52" fill="#c2622d" stroke="#c2622d" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="60" y="210" width="270" height="52" fill="none" stroke="#c2622d" stroke-width="1.4"/>
  <text x="195" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="middle" font-weight="bold">a third coset</text>
  <circle cx="100" cy="250" r="6" fill="#c2622d" fill-opacity="0.8"/>
  <circle cx="148" cy="250" r="6" fill="#c2622d" fill-opacity="0.8"/>
  <circle cx="196" cy="250" r="6" fill="#c2622d" fill-opacity="0.8"/>
  <circle cx="244" cy="250" r="6" fill="#c2622d" fill-opacity="0.8"/>
  <circle cx="292" cy="250" r="6" fill="#c2622d" fill-opacity="0.8"/>
  <line x1="338" y1="236" x2="463" y2="236" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="470,236 463,232.85 463,239.15" fill="#5b6672"/>
  <circle cx="500" cy="236" r="11" fill="#c2622d"/>
  <text x="522" y="241" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="start">one element</text>
  <rect x="60" y="282" width="270" height="52" fill="#6b5b95" stroke="#6b5b95" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="60" y="282" width="270" height="52" fill="none" stroke="#6b5b95" stroke-width="1.4"/>
  <text x="195" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5b95" text-anchor="middle" font-weight="bold">a fourth coset</text>
  <circle cx="100" cy="322" r="6" fill="#6b5b95" fill-opacity="0.8"/>
  <circle cx="148" cy="322" r="6" fill="#6b5b95" fill-opacity="0.8"/>
  <circle cx="196" cy="322" r="6" fill="#6b5b95" fill-opacity="0.8"/>
  <circle cx="244" cy="322" r="6" fill="#6b5b95" fill-opacity="0.8"/>
  <circle cx="292" cy="322" r="6" fill="#6b5b95" fill-opacity="0.8"/>
  <line x1="338" y1="308" x2="463" y2="308" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="470,308 463,304.85 463,311.15" fill="#5b6672"/>
  <circle cx="500" cy="308" r="11" fill="#6b5b95"/>
  <text x="522" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5b95" text-anchor="start">one element</text>
  <text x="60" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The strips all have the same size, because they are cosets of the kernel. So a</text>
  <text x="60" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">map is one to one exactly when its kernel holds the identity alone.</text>
</svg>
