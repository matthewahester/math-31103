<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img">
  <title>A normal subgroup against a subgroup that is not normal</title>
  <desc>Four rows of blocks: for the normal subgroup the left and right partitions match, and for the other subgroup they do not.</desc>
  <rect x="0" y="0" width="720" height="390" fill="#ffffff"/>
  <text x="360" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The same six elements, partitioned four ways</text>
  <text x="60" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="start" font-weight="bold">even permutations, left cosets</text>
  <rect x="60" y="72" width="280" height="44" fill="#3f7a52" stroke="#3f7a52" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="60" y="72" width="280" height="44" fill="none" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="200" y="99" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">e  r  r2</text>
  <rect x="348" y="72" width="280" height="44" fill="#3f7a52" stroke="#3f7a52" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="348" y="72" width="280" height="44" fill="none" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="488" y="99" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">a  b  c</text>
  <text x="60" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="start" font-weight="bold">even permutations, right cosets</text>
  <rect x="60" y="158" width="280" height="44" fill="#3f7a52" stroke="#3f7a52" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="60" y="158" width="280" height="44" fill="none" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="200" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">e  r  r2</text>
  <rect x="348" y="158" width="280" height="44" fill="#3f7a52" stroke="#3f7a52" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="348" y="158" width="280" height="44" fill="none" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="488" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">a  b  c</text>
  <text x="660" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">identical</text>
  <text x="60" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a33a3a" text-anchor="start" font-weight="bold">the two-element subgroup, left cosets</text>
  <rect x="60" y="252" width="184" height="44" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="60" y="252" width="184" height="44" fill="none" stroke="#a33a3a" stroke-width="1.4"/>
  <text x="152" y="279" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">e  a</text>
  <rect x="252" y="252" width="184" height="44" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="252" y="252" width="184" height="44" fill="none" stroke="#a33a3a" stroke-width="1.4"/>
  <text x="344" y="279" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">b  r</text>
  <rect x="444" y="252" width="184" height="44" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="444" y="252" width="184" height="44" fill="none" stroke="#a33a3a" stroke-width="1.4"/>
  <text x="536" y="279" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">c  r2</text>
  <text x="60" y="326" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a33a3a" text-anchor="start" font-weight="bold">the two-element subgroup, right cosets</text>
  <rect x="60" y="338" width="184" height="44" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="60" y="338" width="184" height="44" fill="none" stroke="#a33a3a" stroke-width="1.4"/>
  <text x="152" y="365" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">e  a</text>
  <rect x="252" y="338" width="184" height="44" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="252" y="338" width="184" height="44" fill="none" stroke="#a33a3a" stroke-width="1.4"/>
  <text x="344" y="365" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">b  r2</text>
  <rect x="444" y="338" width="184" height="44" fill="#a33a3a" stroke="#a33a3a" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="444" y="338" width="184" height="44" fill="none" stroke="#a33a3a" stroke-width="1.4"/>
  <text x="536" y="365" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">c  r</text>
  <text x="660" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a33a3a" text-anchor="middle" font-weight="bold">different</text>
  <text x="60" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Here r and r2 are the two three-cycles and a, b, c the three transpositions.</text>
</svg>
