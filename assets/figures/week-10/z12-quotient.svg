  <text x="604" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5b95" text-anchor="middle" font-weight="bold">block 3</text>
  <text x="604" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3, 7, 11</text>
  <rect x="200" y="160" width="320" height="34" fill="#dbe6ef"/>
  <text x="232" y="181.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">plus</text>
  <text x="296" y="181.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">0</text>
  <text x="360" y="181.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">1</text>
