  <text x="488" y="215.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">3</text>
  <line x1="200" y1="194" x2="520" y2="194" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
