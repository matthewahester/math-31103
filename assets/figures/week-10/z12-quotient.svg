  <text x="232" y="283.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">2</text>
  <text x="296" y="283.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">2</text>
  <text x="360" y="283.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="424" y="283.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0</text>
  <text x="488" y="283.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="200" y1="262" x2="520" y2="262" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="232" y="317.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="296" y="317.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="360" y="317.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0</text>
  <text x="424" y="317.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="488" y="317.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="200" y1="296" x2="520" y2="296" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="200" y1="330" x2="520" y2="330" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="264" y1="160" x2="264" y2="330" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="328" y1="160" x2="328" y2="330" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="392" y1="160" x2="392" y2="330" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="456" y1="160" x2="456" y2="330" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="200" y1="160" x2="200" y2="330" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="520" y1="160" x2="520" y2="330" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="50" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Adding any member of one block to any member of another always lands in the same</text>
  <text x="50" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">third block, so the table on the right is well defined and is the table of the</text>
</svg>
