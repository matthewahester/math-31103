<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img">
  <title>The twelve classes modulo twelve collapsed into four blocks</title>
  <desc>Four boxes each holding three of the twelve elements, with an addition table on the four boxes shown beside them.</desc>
  <rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Adding blocks instead of elements</text>
  <rect x="50" y="58" width="148" height="74" fill="#3f7a52" stroke="#3f7a52" stroke-width="1.5" fill-opacity="0.15"/>
  <rect x="50" y="58" width="148" height="74" fill="none" stroke="#3f7a52" stroke-width="1.5"/>
  <text x="124" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">block 0</text>
  <text x="124" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">0, 4, 8</text>
  <rect x="210" y="58" width="148" height="74" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.5" fill-opacity="0.15"/>
  <rect x="210" y="58" width="148" height="74" fill="none" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="284" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">block 1</text>
  <text x="284" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1, 5, 9</text>
  <rect x="370" y="58" width="148" height="74" fill="#c2622d" stroke="#c2622d" stroke-width="1.5" fill-opacity="0.15"/>
  <rect x="370" y="58" width="148" height="74" fill="none" stroke="#c2622d" stroke-width="1.5"/>
  <text x="444" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="middle" font-weight="bold">block 2</text>
  <text x="444" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2, 6, 10</text>
  <rect x="530" y="58" width="148" height="74" fill="#6b5b95" stroke="#6b5b95" stroke-width="1.5" fill-opacity="0.15"/>
