<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img">
  <title>Conjugation as relabelling</title>
  <desc>Two triangles with corners labelled differently, an arrow between them marked as a relabelling, showing that a motion becomes a different-looking motion with the same shape.</desc>
  <rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Conjugating is doing the same motion with the labels moved</text>
  <polygon points="160,88 114,170 206,170" fill="#2f6f9f" fill-opacity="0.13"/>
  <polyline points="160,88 114,170 206,170 160,88" fill="none" stroke="#2f6f9f" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="160" cy="88" r="15" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="160" y="93" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <circle cx="114" cy="170" r="15" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="114" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <circle cx="206" cy="170" r="15" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="206" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="160" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="middle">flip fixing corner 1</text>
  <polygon points="540,88 494,170 586,170" fill="#c2622d" fill-opacity="0.13"/>
  <polyline points="540,88 494,170 586,170 540,88" fill="none" stroke="#c2622d" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="540" cy="88" r="15" fill="#ffffff" stroke="#c2622d" stroke-width="1.5"/>
  <text x="540" y="93" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <circle cx="494" cy="170" r="15" fill="#ffffff" stroke="#c2622d" stroke-width="1.5"/>
  <text x="494" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <circle cx="586" cy="170" r="15" fill="#ffffff" stroke="#c2622d" stroke-width="1.5"/>
  <text x="586" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="540" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="middle">flip fixing corner 2</text>
  <line x1="240" y1="130" x2="443" y2="130" stroke="#5b6672" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="450,130 443,126.85 443,133.15" fill="#5b6672"/>
  <text x="345" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">relabel the corners by g</text>
  <line x1="450" y1="168" x2="247" y2="168" stroke="#5b6672" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <polygon points="240,168 247,171.15 247,164.85" fill="#5b6672"/>
  <text x="345" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">and back by g inverse</text>
  <text x="60" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The two flips are different elements of the group, and they are the same kind of</text>
  <text x="60" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">motion seen through different labels. That is what conjugation does: g x g inverse</text>
  <text x="60" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">is x performed in relabelled coordinates. A subgroup is normal exactly when this</text>
  <text x="60" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">relabelling never carries an element out of it, so the subgroup is a property of</text>
  <text x="60" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the group rather than of a particular choice of names.</text>
</svg>
