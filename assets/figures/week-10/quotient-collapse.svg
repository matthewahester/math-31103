<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" width="680" height="366" role="img">
  <title>The quotient map collapsing each coset to one point</title>
  <desc>A tall column of parallel strips on the left, each strip joined by an arrow to a single dot on the right, showing many elements becoming one element of the quotient.</desc>
  <rect x="0" y="0" width="680" height="366" fill="#ffffff"/>
  <text x="340" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Each coset becomes a single element</text>
  <rect x="60" y="62" width="250" height="46" fill="#3f7a52" stroke="#3f7a52" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="60" y="62" width="250" height="46" fill="none" stroke="#3f7a52" stroke-width="1.4"/>
  <circle cx="96" cy="85" r="7" fill="#3f7a52" fill-opacity="0.8"/>
  <circle cx="154" cy="85" r="7" fill="#3f7a52" fill-opacity="0.8"/>
  <circle cx="212" cy="85" r="7" fill="#3f7a52" fill-opacity="0.8"/>
  <circle cx="270" cy="85" r="7" fill="#3f7a52" fill-opacity="0.8"/>
  <line x1="320" y1="85" x2="463" y2="85" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="470,85 463,81.85 463,88.15" fill="#5b6672"/>
  <circle cx="500" cy="85" r="12" fill="#3f7a52"/>
  <text x="540" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="start">one element</text>
  <rect x="60" y="122" width="250" height="46" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="60" y="122" width="250" height="46" fill="none" stroke="#2f6f9f" stroke-width="1.4"/>
  <circle cx="96" cy="145" r="7" fill="#2f6f9f" fill-opacity="0.8"/>
  <circle cx="154" cy="145" r="7" fill="#2f6f9f" fill-opacity="0.8"/>
  <circle cx="212" cy="145" r="7" fill="#2f6f9f" fill-opacity="0.8"/>
  <circle cx="270" cy="145" r="7" fill="#2f6f9f" fill-opacity="0.8"/>
  <line x1="320" y1="145" x2="463" y2="145" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="470,145 463,141.85 463,148.15" fill="#5b6672"/>
  <circle cx="500" cy="145" r="12" fill="#2f6f9f"/>
  <text x="540" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="start">one element</text>
  <rect x="60" y="182" width="250" height="46" fill="#c2622d" stroke="#c2622d" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="60" y="182" width="250" height="46" fill="none" stroke="#c2622d" stroke-width="1.4"/>
  <circle cx="96" cy="205" r="7" fill="#c2622d" fill-opacity="0.8"/>
  <circle cx="154" cy="205" r="7" fill="#c2622d" fill-opacity="0.8"/>
  <circle cx="212" cy="205" r="7" fill="#c2622d" fill-opacity="0.8"/>
  <circle cx="270" cy="205" r="7" fill="#c2622d" fill-opacity="0.8"/>
  <line x1="320" y1="205" x2="463" y2="205" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="470,205 463,201.85 463,208.15" fill="#5b6672"/>
  <circle cx="500" cy="205" r="12" fill="#c2622d"/>
  <text x="540" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="start">one element</text>
  <rect x="60" y="242" width="250" height="46" fill="#6b5b95" stroke="#6b5b95" stroke-width="1.4" fill-opacity="0.16"/>
  <rect x="60" y="242" width="250" height="46" fill="none" stroke="#6b5b95" stroke-width="1.4"/>
  <circle cx="96" cy="265" r="7" fill="#6b5b95" fill-opacity="0.8"/>
  <circle cx="154" cy="265" r="7" fill="#6b5b95" fill-opacity="0.8"/>
  <circle cx="212" cy="265" r="7" fill="#6b5b95" fill-opacity="0.8"/>
  <circle cx="270" cy="265" r="7" fill="#6b5b95" fill-opacity="0.8"/>
  <line x1="320" y1="265" x2="463" y2="265" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="470,265 463,261.85 463,268.15" fill="#5b6672"/>
  <circle cx="500" cy="265" r="12" fill="#6b5b95"/>
  <text x="540" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5b95" text-anchor="start">one element</text>
  <text x="185" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">the group, sliced into cosets</text>
  <text x="540" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the quotient</text>
  <text x="60" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">What the quotient forgets is everything that distinguishes members of one strip.</text>
  <text x="60" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">What it keeps is how the strips combine, which is a group in its own right.</text>
</svg>
