  <text x="340" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">inverse pairs: 1 with 1  2 with 4  3 with 5  6 with 6</text>
  <text x="60" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The shaded cells are exactly the places a one appears, and there is one in every</text>
  <text x="60" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">row. So no non-zero class fails to have an inverse, and the system is a field.</text>
  <text x="60" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Two and four are inverse to each other, as are three and five; one and six are</text>
</svg>
