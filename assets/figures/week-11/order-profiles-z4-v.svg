<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
  <title>Element orders in the two groups of order four</title>
  <desc>Two bar charts counting elements by order, the cyclic group having two elements of order four and the four-group having none.</desc>
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>
  <text x="340" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Counting elements by order separates the two</text>
  <text x="160" y="58" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="middle" font-weight="bold">cyclic group of order four</text>
  <rect x="60" y="196" width="56" height="44" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.4" fill-opacity="0.25"/>
  <rect x="60" y="196" width="56" height="44" fill="none" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="88" y="186" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <text x="88" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">order 1</text>
  <rect x="138" y="196" width="56" height="44" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.4" fill-opacity="0.25"/>
  <rect x="138" y="196" width="56" height="44" fill="none" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="166" y="186" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="middle" font-weight="bold">1</text>
  <text x="166" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">order 2</text>
  <rect x="216" y="152" width="56" height="88" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.4" fill-opacity="0.25"/>
  <rect x="216" y="152" width="56" height="88" fill="none" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="244" y="142" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="middle" font-weight="bold">2</text>
  <text x="244" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">order 4</text>
  <line x1="52" y1="240" x2="308" y2="240" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <text x="490" y="58" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle" font-weight="bold">the four-group</text>
  <rect x="390" y="196" width="56" height="44" fill="#c2622d" stroke="#c2622d" stroke-width="1.4" fill-opacity="0.25"/>
  <rect x="390" y="196" width="56" height="44" fill="none" stroke="#c2622d" stroke-width="1.4"/>
  <text x="418" y="186" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle" font-weight="bold">1</text>
  <text x="418" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">order 1</text>
  <rect x="468" y="108" width="56" height="132" fill="#c2622d" stroke="#c2622d" stroke-width="1.4" fill-opacity="0.25"/>
  <rect x="468" y="108" width="56" height="132" fill="none" stroke="#c2622d" stroke-width="1.4"/>
  <text x="496" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle" font-weight="bold">3</text>
  <text x="496" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">order 2</text>
  <rect x="546" y="234" width="56" height="6" fill="#c9d1d9"/>
  <text x="574" y="224" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">0</text>
  <text x="574" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">order 4</text>
  <line x1="382" y1="240" x2="638" y2="240" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <text x="40" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">An isomorphism carries an element of order four to an element of order four, so</text>
  <text x="40" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">a group with two of them cannot be relabelled into a group with none. No table</text>
  <text x="40" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">comparison is needed once the counts differ.</text>
</svg>
