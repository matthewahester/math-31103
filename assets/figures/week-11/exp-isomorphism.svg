  <line x1="126" y1="262.613" x2="666" y2="262.613" stroke="#c2622d" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 4"/>
  <text x="424.421" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2622d" text-anchor="middle" font-weight="bold">a</text>
  <text x="114" y="266.613" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c2622d" text-anchor="end">1.6</text>
  <line x1="495.474" y1="56" x2="495.474" y2="306" stroke="#6b5b95" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="126" y1="234.466" x2="666" y2="234.466" stroke="#6b5b95" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 4"/>
  <text x="495.474" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5b95" text-anchor="middle" font-weight="bold">b</text>
  <text x="114" y="238.466" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b5b95" text-anchor="end">2.7</text>
  <line x1="566.526" y1="56" x2="566.526" y2="306" stroke="#3f7a52" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="126" y1="188.061" x2="666" y2="188.061" stroke="#3f7a52" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 4"/>
  <text x="566.526" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="middle" font-weight="bold">a plus b</text>
  <text x="114" y="192.061" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="end">4.5</text>
  <text x="56" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The output at a plus b is exactly the output at a times the output at b, which is</text>
  <text x="56" y="402" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the statement that the curve carries the operation on the horizontal axis to the</text>
  <text x="56" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">operation on the vertical one. It is one to one and hits every positive value, so</text>
  <text x="56" y="438" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">it is an isomorphism from the reals under addition to the positives under</text>
</svg>
