<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 448" width="730" height="448" role="img">
  <title>The exponential carries sums to products</title>
  <desc>A curve rising from left to right on axes, with two inputs marked on the horizontal axis and their sum, and the matching outputs on the vertical axis multiplying together.</desc>
  <rect x="0" y="0" width="730" height="448" fill="#ffffff"/>
  <text x="365" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Adding on one side, multiplying on the other</text>
