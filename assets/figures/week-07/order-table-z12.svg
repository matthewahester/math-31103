<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>The order of every element of the integers modulo twelve</title>
  <desc>A table listing each of the twelve elements with the greatest common divisor it shares with twelve and the resulting order.</desc>
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Order equals twelve divided by the shared factor</text>
  <rect x="28" y="60" width="660" height="38" fill="#dbe6ef"/>
  <text x="37" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">element k</text>
  <text x="159" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">0</text>
  <text x="205" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">1</text>
  <text x="251" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">2</text>
  <text x="297" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">3</text>
  <text x="343" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">4</text>
  <text x="389" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">5</text>
  <text x="435" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">6</text>
  <text x="481" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">7</text>
  <text x="527" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">8</text>
  <text x="573" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">9</text>
  <text x="619" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">10</text>
  <text x="665" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">11</text>
  <line x1="28" y1="60" x2="688" y2="60" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="37" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">gcd with 12</text>
  <text x="159" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">12</text>
  <text x="205" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="251" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">2</text>
  <text x="297" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="343" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">4</text>
  <text x="389" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="435" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">6</text>
  <text x="481" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="527" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">4</text>
  <text x="573" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="619" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">2</text>
  <text x="665" y="121.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="28" y1="98" x2="688" y2="98" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="37" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">order of k</text>
  <text x="159" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">1</text>
  <text x="205" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">12</text>
  <text x="251" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">6</text>
  <text x="297" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">4</text>
  <text x="343" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="389" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">12</text>
  <text x="435" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">2</text>
  <text x="481" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">12</text>
  <text x="527" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">3</text>
  <text x="573" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">4</text>
  <text x="619" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">6</text>
  <text x="665" y="159.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">12</text>
  <line x1="28" y1="136" x2="688" y2="136" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="28" y1="174" x2="688" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="136" y1="60" x2="136" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="182" y1="60" x2="182" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="228" y1="60" x2="228" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="274" y1="60" x2="274" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="320" y1="60" x2="320" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="366" y1="60" x2="366" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="412" y1="60" x2="412" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="458" y1="60" x2="458" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="504" y1="60" x2="504" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="550" y1="60" x2="550" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="596" y1="60" x2="596" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="642" y1="60" x2="642" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="28" y1="60" x2="28" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="688" y1="60" x2="688" y2="174" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="182" y="136" width="46" height="38" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.5" fill-opacity="0.6"/>
  <rect x="366" y="136" width="46" height="38" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.5" fill-opacity="0.6"/>
  <rect x="458" y="136" width="46" height="38" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.5" fill-opacity="0.6"/>
  <rect x="642" y="136" width="46" height="38" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.5" fill-opacity="0.6"/>
  <text x="28" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The shaded columns are the four generators, the elements whose order is the</text>
  <text x="28" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">whole twelve. They are exactly the elements sharing no factor with twelve, so</text>
  <text x="28" y="252" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">there are as many of them as there are numbers below twelve coprime to it.</text>
  <text x="28" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Note that 0 shares the factor twelve with twelve, and has order one.</text>
</svg>
