<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
  <title>The divisor lattice of twelve beside the subgroup lattice</title>
  <desc>Two diagrams of the same shape side by side, one built from the divisors of twelve under divisibility and one from the subgroups of the integers modulo twelve.</desc>
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The same picture twice</text>
  <text x="180" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="middle" font-weight="bold">divisors of 12, ordered by dividing</text>
  <line x1="180" y1="286" x2="100" y2="154" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="180" y1="286" x2="260" y2="154" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="100" y1="126" x2="100" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="100" y1="126" x2="260" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="260" y1="126" x2="260" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="100" y1="206" x2="180" y2="74" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="260" y1="206" x2="180" y2="74" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="118" y="45" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="180" y="65" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">12</text>
  <rect x="38" y="125" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="100" y="145" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">6</text>
  <rect x="198" y="125" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="260" y="145" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">4</text>
  <rect x="38" y="205" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="100" y="225" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">3</text>
  <rect x="198" y="205" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="260" y="225" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">2</text>
  <rect x="118" y="285" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="180" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="540" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle" font-weight="bold">subgroups, ordered by containment</text>
  <line x1="540" y1="286" x2="460" y2="154" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="540" y1="286" x2="620" y2="154" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="460" y1="126" x2="460" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="460" y1="126" x2="620" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="620" y1="126" x2="620" y2="234" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="460" y1="206" x2="540" y2="74" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="620" y1="206" x2="540" y2="74" stroke="#c9d1d9" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="478" y="45" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#c2622d" stroke-width="1.4"/>
  <text x="540" y="65" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">all of it</text>
  <rect x="398" y="125" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#c2622d" stroke-width="1.4"/>
  <text x="460" y="145" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">generated by 2</text>
  <rect x="558" y="125" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#c2622d" stroke-width="1.4"/>
  <text x="620" y="145" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">generated by 3</text>
  <rect x="398" y="205" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#c2622d" stroke-width="1.4"/>
  <text x="460" y="225" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">generated by 4</text>
  <rect x="558" y="205" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#c2622d" stroke-width="1.4"/>
  <text x="620" y="225" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">generated by 6</text>
  <rect x="478" y="285" width="124" height="30" fill="#dbe6ef" rx="6" stroke="#c2622d" stroke-width="1.4"/>
  <text x="540" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">just 0</text>
  <text x="60" y="350" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Reading a divisor d on the left, the matching subgroup on the right has order d and is</text>
  <text x="60" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">generated by 12 divided by d. Containment on the right runs the same way as dividing on</text>
  <text x="60" y="386" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the left, so the two diagrams are the same diagram with different labels. Every finite</text>
  <text x="60" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">cyclic group has this property, and no other kind of group need have it.</text>
</svg>
