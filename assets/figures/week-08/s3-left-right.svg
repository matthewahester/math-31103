<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img">
  <title>Left and right cosets of the same subgroup can differ</title>
  <desc>Two tilings of the same six permutations into three pairs, the left tiling and the right tiling grouping them differently.</desc>
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The same subgroup, two different partitions</text>
  <text x="60" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="start" font-weight="bold">left cosets: multiply on the left</text>
  <rect x="60" y="80" width="180" height="60" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="60" y="80" width="180" height="60" fill="none" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="150" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1 2 3)</text>
  <text x="150" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1 3)</text>
  <rect x="260" y="80" width="180" height="60" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="260" y="80" width="180" height="60" fill="none" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="350" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1 2)</text>
  <text x="350" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">e</text>
  <rect x="460" y="80" width="180" height="60" fill="#2f6f9f" stroke="#2f6f9f" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="460" y="80" width="180" height="60" fill="none" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="550" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1 3 2)</text>
  <text x="550" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(2 3)</text>
  <text x="60" y="206" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="start" font-weight="bold">right cosets: multiply on the right</text>
  <rect x="60" y="220" width="180" height="60" fill="#c2622d" stroke="#c2622d" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="60" y="220" width="180" height="60" fill="none" stroke="#c2622d" stroke-width="1.4"/>
  <text x="150" y="246" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1 2 3)</text>
  <text x="150" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(2 3)</text>
  <rect x="260" y="220" width="180" height="60" fill="#c2622d" stroke="#c2622d" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="260" y="220" width="180" height="60" fill="none" stroke="#c2622d" stroke-width="1.4"/>
  <text x="350" y="246" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1 2)</text>
  <text x="350" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">e</text>
  <rect x="460" y="220" width="180" height="60" fill="#c2622d" stroke="#c2622d" stroke-width="1.4" fill-opacity="0.15"/>
  <rect x="460" y="220" width="180" height="60" fill="none" stroke="#c2622d" stroke-width="1.4"/>
  <text x="550" y="246" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1 3 2)</text>
  <text x="550" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">(1 3)</text>
  <text x="60" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Both are partitions of the same six permutations into three pairs of two, so</text>
  <text x="60" y="338" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">both confirm the counting theorem. But the pairs themselves are not the same</text>
  <text x="60" y="356" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">pairs, which means this subgroup does not behave the way the subgroup of even</text>
  <text x="60" y="374" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">permutations does. Week 10 gives that difference a name.</text>
</svg>
