<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img">
  <title>The order of a group split by a subgroup and its index</title>
  <desc>A long bar divided into five equal segments, each labelled with the order of the subgroup, the whole bar labelled with the order of the group.</desc>
  <rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
  <text x="350" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Order equals index times subgroup order</text>
  <rect x="60" y="70" width="116" height="68" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.5"/>
  <text x="118" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">size of H</text>
  <rect x="176" y="70" width="116" height="68" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="234" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">size of H</text>
  <rect x="292" y="70" width="116" height="68" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="350" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">size of H</text>
  <rect x="408" y="70" width="116" height="68" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="466" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">size of H</text>
  <rect x="524" y="70" width="116" height="68" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="582" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">size of H</text>
  <line x1="60" y1="158" x2="640" y2="158" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <text x="350" y="180" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">the whole group</text>
  <text x="118" y="56" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="middle">the subgroup</text>
  <text x="350" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">five equal pieces, so the index is five</text>
  <text x="60" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Nothing here depends on which group it is. The only inputs are that the pieces do</text>
  <text x="60" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">not overlap, that they cover everything, and that they are all the same size —</text>
  <text x="60" y="286" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">so the order of any subgroup must divide the order of the group.</text>
</svg>
