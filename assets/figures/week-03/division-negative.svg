<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img">
  <title>The division algorithm with a negative dividend</title>
  <desc>A number line with the multiples of the divisor marked and the remainder drawn as the short segment from the last multiple at or below the dividend.</desc>
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
  <text x="360" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Dividing -47 by 7</text>
  <line x1="50" y1="150" x2="670" y2="150" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="85.352" y1="143" x2="85.352" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="85.352" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-56</text>
  <line x1="144.507" y1="143" x2="144.507" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="144.507" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-49</text>
  <line x1="203.662" y1="143" x2="203.662" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="203.662" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-42</text>
  <line x1="262.817" y1="143" x2="262.817" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="262.817" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-35</text>
  <line x1="321.972" y1="143" x2="321.972" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="321.972" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-28</text>
  <line x1="381.127" y1="143" x2="381.127" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="381.127" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-21</text>
  <line x1="440.282" y1="143" x2="440.282" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="440.282" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-14</text>
  <line x1="499.437" y1="143" x2="499.437" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="499.437" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-7</text>
  <line x1="558.592" y1="143" x2="558.592" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="558.592" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="617.746" y1="143" x2="617.746" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="617.746" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">7</text>
  <rect x="144.507" y="120" width="16.901" height="22" fill="#dbe6ef" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="152.958" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">r equals 2</text>
  <circle cx="161.408" cy="150" r="6" fill="#c2622d"/>
  <text x="161.408" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="middle" font-weight="bold">a equals -47</text>
  <circle cx="144.507" cy="150" r="5" fill="#2f6f9f"/>
  <text x="144.507" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="middle" font-weight="bold">7 times -7</text>
  <rect x="60" y="210" width="600" height="40" fill="#eef2f6" rx="6" stroke="#3f7a52" stroke-width="1.2"/>
  <text x="360" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="bold">-47 equals 7 times -7 plus 2</text>
  <text x="360" y="243" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">the quotient is the last multiple at or below a, so the remainder cannot be negative</text>
  <rect x="60" y="272" width="600" height="40" fill="#f9ecec" rx="6" stroke="#a33a3a" stroke-width="1.2"/>
  <text x="360" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="bold">-47 equals 7 times -6 plus -5</text>
  <text x="360" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">true arithmetic, but the remainder is negative, so it is not the one the theorem names</text>
</svg>
