<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
  <title>The division algorithm on a number line</title>
  <desc>A number line with the multiples of the divisor marked and the remainder drawn as the short segment from the last multiple at or below the dividend.</desc>
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <text x="360" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Dividing 47 by 7</text>
  <line x1="50" y1="150" x2="670" y2="150" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="102.254" y1="143" x2="102.254" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="102.254" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-7</text>
  <line x1="161.408" y1="143" x2="161.408" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="161.408" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="220.563" y1="143" x2="220.563" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="220.563" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">7</text>
  <line x1="279.718" y1="143" x2="279.718" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="279.718" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">14</text>
  <line x1="338.873" y1="143" x2="338.873" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="338.873" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">21</text>
  <line x1="398.028" y1="143" x2="398.028" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="398.028" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">28</text>
  <line x1="457.183" y1="143" x2="457.183" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="457.183" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">35</text>
  <line x1="516.338" y1="143" x2="516.338" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="516.338" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">42</text>
  <line x1="575.493" y1="143" x2="575.493" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="575.493" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">49</text>
  <line x1="634.648" y1="143" x2="634.648" y2="157" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <text x="634.648" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">56</text>
  <rect x="516.338" y="120" width="42.254" height="22" fill="#dbe6ef" stroke="#3f7a52" stroke-width="1.4"/>
  <text x="537.465" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">r equals 5</text>
  <circle cx="558.592" cy="150" r="6" fill="#c2622d"/>
  <text x="558.592" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="middle" font-weight="bold">a equals 47</text>
  <circle cx="516.338" cy="150" r="5" fill="#2f6f9f"/>
  <text x="516.338" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f6f9f" text-anchor="middle" font-weight="bold">7 times 6</text>
  <rect x="60" y="210" width="600" height="40" fill="#eef2f6" rx="6" stroke="#3f7a52" stroke-width="1.2"/>
  <text x="360" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="bold">47 equals 7 times 6 plus 5</text>
  <text x="360" y="243" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">the quotient is the last multiple at or below a, so the remainder cannot be negative</text>
</svg>
