<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img">
  <title>The common divisors of twenty-four and thirty-six</title>
  <desc>Two rows of divisors, one for each number, with the six divisors they share marked and the largest of those circled.</desc>
  <rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
  <text x="350" y="28" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Every common divisor of 24 and 36, and the greatest of them</text>
  <text x="50" y="95" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="start">divisors of 24</text>
  <rect x="168" y="74" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="190" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
  <rect x="223" y="74" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="245" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
  <rect x="278" y="74" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="300" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
  <rect x="333" y="74" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="355" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">4</text>
  <rect x="388" y="74" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="410" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
  <rect x="443" y="74" width="44" height="32" fill="#ffffff" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="465" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">8</text>
  <rect x="498" y="74" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="520" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">12</text>
  <rect x="553" y="74" width="44" height="32" fill="#ffffff" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="575" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">24</text>
  <text x="50" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="start">divisors of 36</text>
  <rect x="168" y="144" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#c2622d" stroke-width="1.5"/>
  <text x="190" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
  <rect x="223" y="144" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#c2622d" stroke-width="1.5"/>
  <text x="245" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
  <rect x="278" y="144" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#c2622d" stroke-width="1.5"/>
  <text x="300" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
  <rect x="333" y="144" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#c2622d" stroke-width="1.5"/>
  <text x="355" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">4</text>
  <rect x="388" y="144" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#c2622d" stroke-width="1.5"/>
  <text x="410" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
  <rect x="443" y="144" width="44" height="32" fill="#ffffff" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="465" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">9</text>
  <rect x="498" y="144" width="44" height="32" fill="#dbe6ef" rx="5" stroke="#c2622d" stroke-width="1.5"/>
  <text x="520" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">12</text>
  <rect x="553" y="144" width="44" height="32" fill="#ffffff" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="575" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">18</text>
  <rect x="608" y="144" width="44" height="32" fill="#ffffff" rx="5" stroke="#c9d1d9" stroke-width="1"/>
  <text x="630" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">36</text>
  <text x="50" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">shaded in both rows: 1, 2, 3, 4, 6, 12</text>
  <rect x="190" y="248" width="320" height="40" fill="#eef2f6" rx="6" stroke="#3f7a52" stroke-width="1.2"/>
  <text x="350" y="264" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="bold">the greatest common divisor is 12</text>
  <text x="350" y="281" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">and every common divisor in the list divides it</text>
  <text x="50" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">That second line is the property the course actually uses: the greatest common divisor</text>
</svg>
