<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img">
  <title>Why an operation on classes has to be checked</title>
  <desc>Two pairs of representatives on the left feed through the operation into results on the right, with the check being that both results land in the same class.</desc>
  <rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
  <text x="350" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The check every construction on classes needs</text>
  <rect x="60" y="70" width="240" height="46" fill="#eef2f6" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="180" y="89" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">one choice: a and b</text>
  <text x="180" y="106" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">the obvious representatives</text>
  <rect x="60" y="156" width="240" height="46" fill="#eef2f6" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="180" y="175" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">another choice: a prime and b prime</text>
  <text x="180" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">related to the first pair</text>
  <line x1="305" y1="93" x2="393.23" y2="116.219" stroke="#2f6f9f" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="400,118 394.032,113.172 392.429,119.265" fill="#2f6f9f"/>
  <line x1="305" y1="179" x2="393.388" y2="148.297" stroke="#c2622d" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="400,146 392.354,145.321 394.421,151.273" fill="#c2622d"/>
  <rect x="405" y="108" width="235" height="50" fill="#dbe6ef" rx="6" stroke="#1f2933" stroke-width="1.2"/>
  <text x="522.5" y="129" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">do the arithmetic</text>
  <text x="522.5" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">multiply the representatives</text>
  <line x1="522" y1="160" x2="522" y2="189" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="522,196 525.15,189 518.85,189" fill="#5b6672"/>
  <rect x="405" y="200" width="235" height="50" fill="#e2eee6" rx="6" stroke="#3f7a52" stroke-width="1.2"/>
  <text x="522.5" y="221" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">the two results agree</text>
  <text x="522.5" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">as classes, not as integers</text>
  <text x="60" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">if the bottom box fails,</text>
  <text x="60" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">the operation is not defined</text>
  <text x="60" y="276" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">on classes at all</text>
  <text x="60" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The arithmetic is never in doubt. What is in doubt is whether the result depends on a</text>
  <text x="60" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">choice nobody was supposed to be making.</text>
</svg>
