<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" width="620" height="350" role="img">
  <title>The invertible classes modulo twelve under multiplication</title>
  <desc>A four by four multiplication table on the classes 1, 5, 7, 11 modulo twelve, with the identity appearing along the whole diagonal.</desc>
  <rect x="0" y="0" width="620" height="350" fill="#ffffff"/>
  <text x="310" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Multiplying the classes coprime to twelve</text>
  <rect x="150" y="97" width="76" height="168" fill="#dbe6ef"/>
  <rect x="226" y="55" width="304" height="42" fill="#dbe6ef"/>
  <rect x="150" y="55" width="380" height="42" fill="#dbe6ef"/>
  <text x="188" y="80.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">times</text>
  <text x="264" y="80.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">1</text>
  <text x="340" y="80.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">5</text>
  <text x="416" y="80.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">7</text>
  <text x="492" y="80.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">11</text>
  <line x1="150" y1="55" x2="530" y2="55" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="188" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">1</text>
  <text x="264" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">1</text>
  <text x="340" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">5</text>
  <text x="416" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">7</text>
  <text x="492" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">11</text>
  <line x1="150" y1="97" x2="530" y2="97" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="188" y="164.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">5</text>
  <text x="264" y="164.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">5</text>
  <text x="340" y="164.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">1</text>
  <text x="416" y="164.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">11</text>
  <text x="492" y="164.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">7</text>
  <line x1="150" y1="139" x2="530" y2="139" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="188" y="206.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">7</text>
  <text x="264" y="206.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">7</text>
  <text x="340" y="206.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">11</text>
  <text x="416" y="206.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">1</text>
  <text x="492" y="206.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">5</text>
  <line x1="150" y1="181" x2="530" y2="181" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="188" y="248.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">11</text>
  <text x="264" y="248.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">11</text>
  <text x="340" y="248.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">7</text>
  <text x="416" y="248.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">5</text>
  <text x="492" y="248.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="150" y1="223" x2="530" y2="223" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="265" x2="530" y2="265" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="226" y1="55" x2="226" y2="265" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="302" y1="55" x2="302" y2="265" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="378" y1="55" x2="378" y2="265" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="454" y1="55" x2="454" y2="265" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="55" x2="150" y2="265" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="530" y1="55" x2="530" y2="265" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="226" y="97" width="76" height="42" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.6" fill-opacity="0.6"/>
  <rect x="302" y="139" width="76" height="42" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.6" fill-opacity="0.6"/>
  <rect x="378" y="181" width="76" height="42" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.6" fill-opacity="0.6"/>
  <rect x="454" y="223" width="76" height="42" fill="#e2eee6" stroke="#3f7a52" stroke-width="1.6" fill-opacity="0.6"/>
  <text x="60" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The class 1 fills the whole diagonal, so every one of these four classes is its</text>
  <text x="60" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">own inverse. No class here has order four, so this system does not consist of the</text>
  <text x="60" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">powers of any single one of its members. Week 6 will meet it again under a name,</text>
  <text x="60" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">and Week 11 will prove that it differs from the other four-element system.</text>
</svg>
