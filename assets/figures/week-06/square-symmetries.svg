<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402" role="img">
  <title>The eight symmetries of a square</title>
  <desc>Eight small labelled squares with numbered corners showing four rotations and four reflections of a square with its corners tracked.</desc>
  <rect x="0" y="0" width="720" height="402" fill="#ffffff"/>
  <text x="360" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Every motion of a square that leaves its outline in place</text>
  <rect x="55" y="60" width="84" height="84" fill="#dbe6ef" rx="4" stroke="#1f2933" stroke-width="1.4"/>
  <text x="67" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="127" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <text x="127" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="67" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">4</text>
  <text x="49" y="164" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">do nothing</text>
  <rect x="225" y="60" width="84" height="84" fill="#dbe6ef" rx="4" stroke="#1f2933" stroke-width="1.4"/>
  <text x="237" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">4</text>
  <text x="297" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="297" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <text x="237" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="219" y="164" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">turn a quarter</text>
  <rect x="395" y="60" width="84" height="84" fill="#dbe6ef" rx="4" stroke="#1f2933" stroke-width="1.4"/>
  <text x="407" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="467" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">4</text>
  <text x="467" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="407" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <text x="389" y="164" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">turn a half</text>
  <rect x="565" y="60" width="84" height="84" fill="#dbe6ef" rx="4" stroke="#1f2933" stroke-width="1.4"/>
  <text x="577" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <text x="637" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="637" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">4</text>
  <text x="577" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="559" y="164" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">turn three</text>
  <text x="559" y="178" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">quarters</text>
  <rect x="55" y="215" width="84" height="84" fill="#f6e6da" rx="4" stroke="#1f2933" stroke-width="1.4"/>
  <text x="67" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <text x="127" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="127" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">4</text>
  <text x="67" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="49" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">flip left to right</text>
  <rect x="225" y="215" width="84" height="84" fill="#f6e6da" rx="4" stroke="#1f2933" stroke-width="1.4"/>
  <text x="237" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">4</text>
  <text x="297" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="297" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <text x="237" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="219" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">flip top to bottom</text>
  <rect x="395" y="215" width="84" height="84" fill="#f6e6da" rx="4" stroke="#1f2933" stroke-width="1.4"/>
  <text x="407" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="467" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">4</text>
  <text x="467" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="407" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <text x="389" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">flip on one</text>
  <text x="389" y="333" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">diagonal</text>
  <rect x="565" y="215" width="84" height="84" fill="#f6e6da" rx="4" stroke="#1f2933" stroke-width="1.4"/>
  <text x="577" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">3</text>
  <text x="637" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">2</text>
  <text x="637" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">1</text>
  <text x="577" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">4</text>
  <text x="559" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">flip on the other</text>
  <text x="559" y="333" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">diagonal</text>
  <text x="55" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The top row turns the square; the bottom row flips it. Each motion is recorded by where</text>
  <text x="55" y="366" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the four numbered corners end up, so each is a permutation of four things — but only</text>
  <text x="55" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">eight of the twenty-four permutations arise this way.</text>
</svg>
