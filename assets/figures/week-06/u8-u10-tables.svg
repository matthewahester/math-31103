  <text x="60" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">so it takes four steps to return, and the whole system is its powers.</text>
  <text x="60" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Four elements each, and no relabelling can turn one table into the other. Week 11 proves it.</text>
